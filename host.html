<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seller's Journey – Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="host">
  <header id="topbar" class="hidden">
    <div><div class="tag" id="tbTag"></div><h1 id="tbTitle"></h1></div>
    <div style="display:flex;align-items:center;gap:22px"><div class="steps" id="steps"></div><div class="timer" id="timer"></div><button class="ghost" id="btnSkip">Skip ⏭</button></div>
  </header>

  <!-- LOBBY -->
  <section id="s-lobby" class="hidden">
    <div class="lobby-grid">
      <div class="join-card">
        <div class="tag">Scan &amp; join</div>
        <img id="qr" alt="QR code">
        <div class="url" id="joinUrl"></div>
      </div>
      <div class="players-wrap">
        <div class="tag">Seller's Journey · First Conditional</div>
        <h1 style="font-size:60px">Waiting for sellers…</h1>
        <div style="display:flex;align-items:baseline;gap:14px"><span class="count" id="lobbyCount">0</span><span class="muted" style="font-size:24px">players</span></div>
        <div class="chips" id="chips"></div>
        <div style="margin-top:auto;display:flex;flex-direction:column;gap:14px">
          <div class="rounds-pick" id="roundPick"></div>
          <div class="controls">
            <button id="btnStart">▶ START</button>
            <button class="ghost" id="btnNew">New game</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ROUND INTRO -->
  <section id="s-intro" class="hidden center-col" style="min-height:80vh">
    <div class="tag" id="inTag" style="font-size:22px"></div>
    <div style="font-size:120px;font-weight:900;letter-spacing:-3px" id="inTitle"></div>
    <div style="font-size:34px;color:var(--muted);max-width:1300px" id="inSub"></div>
    <button id="btnGo" style="font-size:30px;padding:20px 50px;margin-top:20px">GO!</button>
  </section>

  <!-- ROUND PLAY -->
  <section id="s-play" class="hidden" style="flex:1;display:flex;flex-direction:column">
    <div id="play" style="flex:1;display:flex;flex-direction:column"></div>
  </section>

  <!-- RESULTS -->
  <section id="s-results" class="hidden">
    <header>
      <div><div class="tag" id="resTag">Results</div><h1>Who is the strongest seller?</h1></div>
      <div class="controls"><span class="muted" id="hpInfo"></span><button id="btnNext">Next round ▶</button></div>
    </header>
    <div class="board" id="board" style="margin-top:20px"></div>
  </section>

  <!-- DEATHMATCH -->
  <section id="s-deathmatch" class="hidden">
    <header>
      <div><div class="tag">Final · Deathmatch</div><h1>Correct answer = punch. Wrong answer = miss.</h1></div>
      <div class="controls"><span class="count" id="aliveCount" style="font-size:44px">0</span><span class="muted">alive</span><button class="ghost" id="btnEndDM">End</button></div>
    </header>
    <div class="dm">
      <div id="dmRing"></div>
      <div class="feed" id="feed"><div class="tag">Fight log</div></div>
    </div>
  </section>

  <div id="winner" class="winner hidden">
    <div class="belt">🏆</div>
    <div class="tag">Best seller of the class</div>
    <div class="big" id="winnerName"></div>
    <div class="controls"><button id="btnLobby">Back to lobby</button></div>
  </div>
</div>
<script type="module" src="host.js"></script>
</body>
</html>
